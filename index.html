<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>在庫管理 - 権兵衛</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
:root{
  --green:#1D9E75;--green-light:#EAF3DE;--green-dark:#0F6E56;
  --red:#D85A30;--red-light:#FAECE7;
  --amber:#BA7517;--amber-light:#FAEEDA;
  --text:#2C2C2A;--text2:#5F5E5A;--text3:#888780;
  --border:#D3D1C7;--bg:#F8F7F4;--white:#fff;
  --radius:10px;--radius-sm:6px;
}
body{font-family:-apple-system,BlinkMacSystemFont,'Hiragino Sans','Yu Gothic UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;max-width:480px;margin:0 auto;}

/* ログイン画面 */
.login-screen{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;}
.login-logo{width:64px;height:64px;background:var(--green);border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:32px;margin-bottom:16px;}
.login-title{font-size:22px;font-weight:700;color:var(--text);margin-bottom:4px;}
.login-sub{font-size:13px;color:var(--text3);margin-bottom:32px;}
.login-card{background:var(--white);border-radius:var(--radius);border:1px solid var(--border);padding:20px;width:100%;max-width:360px;}
.login-label{font-size:11px;font-weight:600;color:var(--text2);margin-bottom:6px;}
.login-select,.login-input{width:100%;padding:11px 12px;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:15px;background:var(--bg);color:var(--text);outline:none;appearance:none;-webkit-appearance:none;margin-bottom:14px;}
.login-select:focus,.login-input:focus{border-color:var(--green);background:var(--white);}
.login-btn{width:100%;padding:13px;border-radius:var(--radius);border:none;background:var(--green);color:white;font-size:15px;font-weight:600;cursor:pointer;margin-top:4px;}
.login-btn:active{opacity:.85;}
.login-btn:disabled{opacity:.5;cursor:not-allowed;}
.login-error{background:var(--red-light);border:1px solid #F09595;border-radius:var(--radius-sm);padding:10px 12px;font-size:13px;color:var(--red);margin-bottom:12px;display:none;}

/* メインアプリ */
.app{display:none;}
.header{background:var(--white);border-bottom:1px solid var(--border);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;}
.header-left{display:flex;align-items:center;gap:8px;}
.header-icon{width:32px;height:32px;background:var(--green);border-radius:8px;display:flex;align-items:center;justify-content:center;color:white;font-size:16px;}
.header-title{font-size:15px;font-weight:600;}
.header-sub{font-size:11px;color:var(--text3);}
.header-right{display:flex;align-items:center;gap:6px;}
.sync-btn,.switch-btn{background:none;border:1px solid var(--border);border-radius:20px;padding:5px 10px;font-size:11px;color:var(--text2);cursor:pointer;white-space:nowrap;}
.sync-btn:active,.switch-btn:active{background:#F1EFE8;}
.switch-btn{color:var(--red);}
.nav{background:var(--white);border-bottom:1px solid var(--border);display:flex;position:sticky;top:57px;z-index:99;}
.nav-btn{flex:1;padding:10px 2px 8px;font-size:10px;color:var(--text3);border:none;background:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;border-bottom:2px solid transparent;transition:all .15s;}
.nav-btn.active{color:var(--green);border-bottom-color:var(--green);}
.nav-btn svg{width:20px;height:20px;}
.screen{display:none;padding:12px 12px 80px;}
.screen.active{display:block;}
.loading{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 20px;gap:12px;color:var(--text3);}
.spinner{width:32px;height:32px;border:3px solid var(--border);border-top-color:var(--green);border-radius:50%;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.section-title{font-size:11px;font-weight:600;color:var(--text3);letter-spacing:.05em;margin:16px 0 8px;}
.summary-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:4px;}
.summary-card{background:var(--white);border-radius:var(--radius);padding:12px 14px;border:1px solid var(--border);}
.summary-label{font-size:11px;color:var(--text3);margin-bottom:4px;}
.summary-val{font-size:22px;font-weight:700;}
.summary-val.warn{color:var(--amber);}
.item-list{display:flex;flex-direction:column;gap:6px;}
.item-card{background:var(--white);border-radius:var(--radius);padding:11px 13px;border:1px solid var(--border);display:flex;align-items:center;gap:10px;}
.item-card.alert{border-left:3px solid var(--red);padding-left:10px;}
.item-info{flex:1;min-width:0;}
.item-name{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.item-meta{font-size:11px;color:var(--text3);margin-top:2px;}
.item-stock{text-align:right;flex-shrink:0;}
.item-stock-num{font-size:16px;font-weight:700;}
.item-stock-unit{font-size:10px;color:var(--text3);}
.badge{display:inline-block;font-size:10px;padding:2px 7px;border-radius:10px;font-weight:600;background:var(--red-light);color:var(--red);}
.search-wrap{position:relative;margin-bottom:10px;}
.search-wrap svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--text3);}
.search-input{width:100%;padding:9px 12px 9px 34px;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:14px;background:var(--white);color:var(--text);outline:none;}
.search-input:focus{border-color:var(--green);}
.filter-tabs{display:flex;gap:6px;margin-bottom:10px;overflow-x:auto;padding-bottom:2px;}
.filter-tab{flex-shrink:0;padding:5px 12px;border-radius:20px;border:1px solid var(--border);background:var(--white);font-size:12px;color:var(--text2);cursor:pointer;white-space:nowrap;}
.filter-tab.active{background:var(--green);color:white;border-color:var(--green);}
.action-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px;}
.action-card{background:var(--white);border-radius:var(--radius);padding:20px 12px;border:1px solid var(--border);display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;transition:transform .15s;}
.action-card:active{transform:scale(.97);}
.action-card.in{border-top:3px solid var(--green);}
.action-card.out{border-top:3px solid var(--red);}
.action-icon{font-size:28px;}
.action-label{font-size:14px;font-weight:600;}
.action-sub{font-size:11px;color:var(--text3);}
.back-btn{display:flex;align-items:center;gap:4px;font-size:13px;color:var(--text2);background:none;border:none;cursor:pointer;margin-bottom:12px;padding:4px 0;}
.form-card{background:var(--white);border-radius:var(--radius);padding:14px;border:1px solid var(--border);margin-bottom:12px;}
.form-type-label{font-size:14px;font-weight:600;margin-bottom:14px;display:flex;align-items:center;gap:6px;}
.form-type-label.in{color:var(--green);}
.form-type-label.out{color:var(--red);}
.form-row{margin-bottom:12px;}
.form-label{font-size:11px;font-weight:600;color:var(--text2);margin-bottom:5px;}
.form-row select,.form-row input{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:14px;background:var(--white);color:var(--text);outline:none;appearance:none;-webkit-appearance:none;}
.form-row select:focus,.form-row input:focus{border-color:var(--green);}
.submit-btn{width:100%;padding:14px;border-radius:var(--radius);border:none;font-size:15px;font-weight:600;cursor:pointer;transition:opacity .15s;}
.submit-btn:active{opacity:.8;}
.submit-btn.in{background:var(--green);color:white;}
.submit-btn.out{background:var(--red);color:white;}
.submit-btn:disabled{opacity:.5;cursor:not-allowed;}
.log-item{background:var(--white);border-radius:var(--radius);padding:10px 13px;border:1px solid var(--border);margin-bottom:6px;display:flex;align-items:flex-start;gap:10px;}
.log-dot{width:8px;height:8px;border-radius:50%;margin-top:5px;flex-shrink:0;}
.log-dot.in{background:var(--green);}
.log-dot.out{background:var(--red);}
.log-dot.adj{background:var(--amber);}
.log-info{flex:1;min-width:0;}
.log-name{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.log-meta{font-size:11px;color:var(--text3);margin-top:2px;}
.log-right{text-align:right;flex-shrink:0;}
.log-qty{font-size:14px;font-weight:700;}
.log-qty.in{color:var(--green);}
.log-qty.out{color:var(--red);}
.log-qty.adj{color:var(--amber);}
.log-time{font-size:11px;color:var(--text3);}
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);padding:10px 20px;border-radius:20px;font-size:13px;font-weight:500;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap;z-index:999;}
.toast.success{background:var(--green);color:white;}
.toast.error{background:var(--red);color:white;}
.toast.show{opacity:1;}
.error-box{background:var(--red-light);border:1px solid #F09595;border-radius:var(--radius);padding:12px;font-size:13px;color:var(--red);margin-bottom:12px;}
.empty{text-align:center;padding:40px 20px;color:var(--text3);font-size:14px;}
</style>
</head>
<body>

<!-- ログイン画面 -->
<div class="login-screen" id="login-screen">
  <div class="login-logo">🍱</div>
  <div class="login-title">権兵衛 在庫管理</div>
  <div class="login-sub">店舗を選択してください</div>
  <div class="login-card">
    <div class="login-error" id="login-error">店舗を選択してください</div>
    <div class="login-label">店舗</div>
    <select class="login-select" id="login-store">
      <option value="">選択してください</option>
      <option value="umecen">梅北セントラルキッチン</option>
      <option value="minamimorimachi">南森町店</option>
      <option value="lucua">ルクア大阪店</option>
      <option value="links">LINKS UMEDA店</option>
      <option value="umekita">梅北店</option>
      <option value="chayamachi">茶屋町店</option>
    </select>
    <button class="login-btn" onclick="doLogin()">ログイン</button>
  </div>
</div>

<!-- メインアプリ -->
<div class="app" id="app">
  <div class="header">
    <div class="header-left">
      <div class="header-icon">🍱</div>
      <div>
        <div class="header-title" id="shopName">在庫管理</div>
        <div class="header-sub" id="lastSync">読み込み中...</div>
      </div>
    </div>
    <div class="header-right">
      <button class="sync-btn" onclick="syncAll()">↻ 同期</button>
      <button class="switch-btn" onclick="doLogout()">店舗切替</button>
    </div>
  </div>

  <nav class="nav">
    <button class="nav-btn active" onclick="showScreen('dash',this)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
      ホーム
    </button>
    <button class="nav-btn" onclick="showScreen('list',this)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/></svg>
      在庫一覧
    </button>
    <button class="nav-btn" onclick="showScreen('move',this)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><polyline points="19 12 12 19 5 12"/></svg>
      入出庫
    </button>
    <button class="nav-btn" onclick="showScreen('log',this)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
      履歴
    </button>
  </nav>

  <div id="screen-dash" class="screen active">
    <div id="dash-loading" class="loading"><div class="spinner"></div><span>データ取得中...</span></div>
    <div id="dash-content" style="display:none;">
      <div class="summary-grid">
        <div class="summary-card"><div class="summary-label">総アイテム数</div><div class="summary-val" id="stat-total">-</div></div>
        <div class="summary-card"><div class="summary-label">発注アラート</div><div class="summary-val warn" id="stat-alert">-</div></div>
      </div>
      <div class="section-title">⚠ 発注が必要な商品</div>
      <div class="item-list" id="alert-list"></div>
      <div class="section-title">最近の入出庫</div>
      <div id="recent-log"></div>
    </div>
  </div>

  <div id="screen-list" class="screen">
    <div class="search-wrap">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input class="search-input" type="text" placeholder="商品名・SKUで検索..." oninput="filterList(this.value)" id="search-input">
    </div>
    <div class="filter-tabs" id="supplier-tabs"></div>
    <div id="list-loading" class="loading"><div class="spinner"></div><span>読み込み中...</span></div>
    <div class="item-list" id="inv-list"></div>
  </div>

  <div id="screen-move" class="screen">
    <div id="move-top">
      <div class="action-grid">
        <div class="action-card in" onclick="showForm('in')">
          <div class="action-icon">📥</div>
          <div class="action-label">入庫登録</div>
          <div class="action-sub">仕入れ・受取</div>
        </div>
        <div class="action-card out" onclick="showForm('out')">
          <div class="action-icon">📤</div>
          <div class="action-label">出庫登録</div>
          <div class="action-sub">使用・払出し</div>
        </div>
      </div>
    </div>
    <div id="move-form" style="display:none;"></div>
  </div>

  <div id="screen-log" class="screen">
    <div id="log-loading" class="loading"><div class="spinner"></div><span>読み込み中...</span></div>
    <div id="log-content" style="display:none;">
      <div class="filter-tabs">
        <button class="filter-tab active" onclick="filterLog('all',this)">すべて</button>
        <button class="filter-tab" onclick="filterLog('入庫',this)">入庫</button>
        <button class="filter-tab" onclick="filterLog('出庫',this)">出庫</button>
        <button class="filter-tab" onclick="filterLog('棚卸調整',this)">棚卸調整</button>
      </div>
      <div id="log-list"></div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ===== 店舗設定 =====
const STORES = {
  umecen:          { name: '梅北セントラルキッチン', pass: 'umecen',           api: 'https://script.google.com/macros/s/AKfycbwSZEUDKvhn2ThTzQsvx9FpWXMSQ1BnMWvUkmEdtoPLpDPWfK6TIEvOb895vkzOqG-X/exec' },
  minamimorimachi: { name: '南森町店',               pass: 'minamimorimachi',  api: 'https://script.google.com/macros/s/AKfycbykpuGAvAwUJo3scqASB1qXMgiw2S4pcC5SW71o25SGBeWz6u5Cf6xwm2_EOL7qwZaR/exec' },
  lucua:           { name: 'ルクア大阪店',            pass: 'lucua',            api: 'https://script.google.com/macros/s/AKfycbxnqKBHY6kEeoUdaYEBFJvjvwvhagni1Qj-U0CKBra1zevpv4GAaHdCALz7FA6mv4Y/exec' },
  links:           { name: 'LINKS UMEDA店',          pass: 'links',            api: 'https://script.google.com/macros/s/AKfycbybZ7VoY5hnmBYbktUjk3TGBP6WEG6l46BLLJKikuW6WojP5ZnArF503NuHd0ScczNd/exec' },
  umekita:         { name: '梅北店',                  pass: 'umekita',          api: 'https://script.google.com/macros/s/AKfycbwZgy_g6Y-31vnb2PN_R2wg2ODjpkSmEcOOGWSdKBXHWbRvm7uYr3yXm99eT679SXFR/exec' },
  chayamachi:      { name: '茶屋町店',                pass: 'chayamachi',       api: 'https://script.google.com/macros/s/AKfycbyaitrfJ6svJBkYbiykvj6jOqVVAzFthDzjhyDzJMl7voMyvEUDdTScUetsAP7u6fas/exec' },
};

let API = '';
let state = { inventory:[], history:[], masters:{} };
let logFilter = 'all';
let supplierFilter = 'all';

// ===== ログイン =====
function doLogin() {
  const storeKey = document.getElementById('login-store').value;
  const errEl = document.getElementById('login-error');
  errEl.style.display = 'none';

  if (!storeKey) {
    errEl.textContent = '店舗を選択してください';
    errEl.style.display = 'block';
    return;
  }

  const store = STORES[storeKey];
  API = store.api;
  sessionStorage.setItem('storeKey', storeKey);
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  document.getElementById('shopName').textContent = store.name;
  resetState();
  init();
}

function doLogout() {
  sessionStorage.removeItem('storeKey');
  API = '';
  resetState();
  document.getElementById('app').style.display = 'none';
  document.getElementById('login-screen').style.display = 'flex';
  document.getElementById('login-error').style.display = 'none';
  document.querySelectorAll('.nav-btn').forEach((b,i) => b.classList.toggle('active', i===0));
  document.querySelectorAll('.screen').forEach((s,i) => s.classList.toggle('active', i===0));
}

function resetState() {
  state = { inventory:[], history:[], masters:{} };
  logFilter = 'all'; supplierFilter = 'all';
  document.getElementById('dash-loading').style.display = 'flex';
  document.getElementById('dash-content').style.display = 'none';
  document.getElementById('list-loading').style.display = 'flex';
  document.getElementById('inv-list').innerHTML = '';
  document.getElementById('supplier-tabs').innerHTML = '';
  document.getElementById('log-loading').style.display = 'flex';
  document.getElementById('log-content').style.display = 'none';
  document.getElementById('search-input').value = '';
}

// セッション復元
window.addEventListener('load', () => {
  const storeKey = sessionStorage.getItem('storeKey');
  if (storeKey && STORES[storeKey]) {
    API = STORES[storeKey].api;
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    document.getElementById('shopName').textContent = STORES[storeKey].name;
    init();
  }
});

// ===== データ取得 =====
async function init() {
  try {
    await Promise.all([loadMasters(), loadInventory(), loadHistory()]);
    renderDash();
    document.getElementById('list-loading').style.display = 'none';
    renderInvList(applyFilters(''));
    renderSupplierTabs();
  } catch(e) {
    document.getElementById('dash-loading').innerHTML = '<div class="empty">読み込みエラー。再度お試しください。</div>';
  }
}

async function syncAll() {
  showToast('同期中...', 'success');
  await Promise.all([loadMasters(), loadInventory(), loadHistory()]);
  renderDash();
  renderInvList(applyFilters(document.getElementById('search-input').value));
  if (state.history.length) renderLogList(state.history);
  showToast('同期しました ✓', 'success');
}

async function loadMasters() {
  const r = await fetch(`${API}?action=getMasters`);
  const d = await r.json();
  if (d.ok) { state.masters = d; }
}

async function loadInventory() {
  const r = await fetch(`${API}?action=getInventory`);
  const d = await r.json();
  if (d.ok) {
    state.inventory = d.items;
    const t = new Date();
    document.getElementById('lastSync').textContent = `最終同期 ${t.getHours()}:${String(t.getMinutes()).padStart(2,'0')}`;
  }
}

async function loadHistory() {
  document.getElementById('log-loading').style.display = 'flex';
  document.getElementById('log-content').style.display = 'none';
  const r = await fetch(`${API}?action=getHistory&limit=100`);
  const d = await r.json();
  if (d.ok) { state.history = d.history; renderLogList(state.history); }
  document.getElementById('log-loading').style.display = 'none';
  document.getElementById('log-content').style.display = 'block';
}

// ===== 表示 =====
function fmtNum(v) { const n = Number(v||0); return Number.isInteger(n) ? n : parseFloat(n.toFixed(1)); }
function getStock(item) { return fmtNum(item['現在庫(自動)'] || item['現在庫'] || 0); }
function isAlert(item) {
  const p = Number(item['発注点']||0);
  if (!item['SKU'] || p <= 0) return false;
  if (item['発注済み'] === true) return false;
  return getStock(item) <= p;
}

function renderDash() {
  const alerts = state.inventory.filter(isAlert);
  document.getElementById('stat-total').textContent = state.inventory.length;
  document.getElementById('stat-alert').textContent = alerts.length + ' 件';
  document.getElementById('alert-list').innerHTML = alerts.length
    ? alerts.slice(0,10).map(i => itemCardHTML(i, true)).join('')
    : '<div class="empty">発注アラートはありません ✓</div>';
  document.getElementById('recent-log').innerHTML = state.history.length
    ? state.history.slice(0,5).map(h => logItemHTML(h)).join('')
    : '<div class="empty">履歴がありません</div>';
  document.getElementById('dash-loading').style.display = 'none';
  document.getElementById('dash-content').style.display = 'block';
}

function itemCardHTML(item, badge) {
  const stock = getStock(item);
  return `<div class="item-card ${isAlert(item)?'alert':''}">
    <div class="item-info">
      <div class="item-name">${item['品名']||''}</div>
      <div class="item-meta">${item['仕入先']||''} ${badge?'<span class="badge">要発注</span>':''}</div>
    </div>
    <div class="item-stock">
      <div class="item-stock-num">${stock}</div>
      <div class="item-stock-unit">${item['単位']||''}</div>
    </div>
  </div>`;
}

function renderSupplierTabs() {
  const suppliers = [...new Set(state.inventory.map(i => i['仕入先']).filter(Boolean))].sort();
  document.getElementById('supplier-tabs').innerHTML =
    `<button class="filter-tab active" onclick="setSupplier('all',this)">すべて</button>` +
    suppliers.map(s => `<button class="filter-tab" onclick="setSupplier('${s.replace(/'/g,"\\'")}',this)">${s}</button>`).join('');
}

function setSupplier(s, btn) {
  supplierFilter = s;
  document.querySelectorAll('#supplier-tabs .filter-tab').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderInvList(applyFilters(document.getElementById('search-input').value));
}

function filterList(q) { renderInvList(applyFilters(q)); }

function applyFilters(q) {
  let items = state.inventory;
  if (supplierFilter !== 'all') items = items.filter(i => i['仕入先'] === supplierFilter);
  if (q) { const lq = q.toLowerCase(); items = items.filter(i => (i['品名']||'').toLowerCase().includes(lq)||(i['SKU']||'').toLowerCase().includes(lq)); }
  return items;
}

function renderInvList(items) {
  document.getElementById('inv-list').innerHTML = items.length ? items.map(i => itemCardHTML(i,false)).join('') : '<div class="empty">該当商品なし</div>';
}

// ===== 入出庫 =====
function showForm(type) {
  document.getElementById('move-top').style.display = 'none';
  const products = state.masters.products || [];
  const persons = state.masters.persons || [];
  const suppliers = [...new Set(products.map(p => p['仕入先']).filter(Boolean))].sort();
  const supplierOpts = suppliers.map(s => `<option value="${s}">${s}</option>`).join('');
  const personOpts = persons.map(p => `<option value="${p}">${p}</option>`).join('');
  const cl = type==='in'?'in':'out', label = type==='in'?'入庫登録':'出庫登録', icon = type==='in'?'📥':'📤';
  document.getElementById('move-form').innerHTML = `
    <button class="back-btn" onclick="hideForm()">← 戻る</button>
    <div id="form-error"></div>
    <div class="form-card">
      <div class="form-type-label ${cl}">${icon} ${label}</div>
      <div class="form-row"><div class="form-label">仕入先 *</div>
        <select id="f-supplier-sel" onchange="onSupplierChange(this)"><option value="">選択してください</option>${supplierOpts}</select></div>
      <div class="form-row"><div class="form-label">商品 *</div>
        <select id="f-product" onchange="onProductChange(this)" disabled><option value="">仕入先を先に選択</option></select></div>
      <div class="form-row"><div class="form-label">数量 *</div>
        <input type="number" id="f-qty" placeholder="例：10" min="0.1" step="0.1"></div>
      <div class="form-row"><div class="form-label">単位</div>
        <input type="text" id="f-unit" readonly style="background:#f8f7f4;color:#888;"></div>
      <div class="form-row"><div class="form-label">処理者 *</div>
        <select id="f-handler"><option value="">選択してください</option>${personOpts}</select></div>
      <div class="form-row"><div class="form-label">備考（任意）</div>
        <input type="text" id="f-memo" placeholder="ロット番号・理由など"></div>
      <input type="hidden" id="f-sku"><input type="hidden" id="f-supplier">
      <input type="hidden" id="f-type" value="${type==='in'?'入庫':'出庫'}">
    </div>
    <button class="submit-btn ${cl}" id="submit-btn" onclick="submitForm()">${label}する</button>`;
  document.getElementById('move-form').style.display = 'block';
}

function onSupplierChange(sel) {
  const supplier = sel.value;
  document.getElementById('f-supplier').value = supplier;
  const productSel = document.getElementById('f-product');
  document.getElementById('f-sku').value = '';
  document.getElementById('f-unit').value = '';
  if (!supplier) { productSel.innerHTML = '<option value="">仕入先を先に選択</option>'; productSel.disabled = true; return; }
  const products = (state.masters.products||[]).filter(p => p['仕入先']===supplier);
  productSel.innerHTML = '<option value="">選択してください</option>' +
    products.map(p => `<option value="${[p['品名'],p['SKU']||'',p['仕入先']||'',p['単位']||''].join('|')}">${p['品名']}</option>`).join('');
  productSel.disabled = false;
}

function onProductChange(sel) {
  if (!sel.value) return;
  const p = sel.value.split('|');
  document.getElementById('f-sku').value = p[1]||'';
  document.getElementById('f-supplier').value = p[2]||'';
  document.getElementById('f-unit').value = p[3]||'';
}

function hideForm() {
  document.getElementById('move-top').style.display = 'block';
  document.getElementById('move-form').style.display = 'none';
  document.getElementById('move-form').innerHTML = '';
}

async function submitForm() {
  const btn = document.getElementById('submit-btn');
  const errEl = document.getElementById('form-error');
  errEl.innerHTML = '';
  const productVal = document.getElementById('f-product').value;
  const qty = document.getElementById('f-qty').value;
  const handler = document.getElementById('f-handler').value;
  if (!productVal) { errEl.innerHTML='<div class="error-box">商品を選択してください</div>'; return; }
  if (!qty || Number(qty) <= 0) { errEl.innerHTML='<div class="error-box">数量を正しく入力してください</div>'; return; }
  if (!handler) { errEl.innerHTML='<div class="error-box">処理者を選択してください</div>'; return; }
  btn.disabled = true; btn.textContent = '送信中...';
  try {
    const txType = document.getElementById('f-type').value;
    const params = new URLSearchParams({
      action: 'addTransaction',
      name: productVal.split('|')[0],
      sku: document.getElementById('f-sku').value,
      type: txType,
      qty: Number(qty),
      handler,
      supplier: document.getElementById('f-supplier').value,
      memo: document.getElementById('f-memo').value
    });
    const r = await fetch(API + '?' + params.toString());
    const d = await r.json();
    if (d.ok) {
      showToast(`✓ ${txType}を記録しました`, 'success');
      hideForm();
      await loadInventory();
      renderDash();
      renderInvList(applyFilters(document.getElementById('search-input').value));
    } else {
      errEl.innerHTML = `<div class="error-box">エラー: ${d.error}</div>`;
      btn.disabled = false; btn.textContent = '再送信';
    }
  } catch(e) {
    errEl.innerHTML = '<div class="error-box">通信エラーが発生しました</div>';
    btn.disabled = false; btn.textContent = '再送信';
  }
}

// ===== 履歴 =====
function filterLog(type, btn) {
  logFilter = type;
  document.querySelectorAll('#screen-log .filter-tab').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  const f = type==='all' ? state.history : state.history.filter(h => h['種別']===type);
  document.getElementById('log-list').innerHTML = f.length ? f.map(h => logItemHTML(h)).join('') : '<div class="empty">該当する履歴がありません</div>';
}

function renderLogList(history) {
  const f = logFilter==='all' ? history : history.filter(h => h['種別']===logFilter);
  document.getElementById('log-list').innerHTML = f.length ? f.map(h => logItemHTML(h)).join('') : '<div class="empty">履歴がありません</div>';
}

function logItemHTML(h) {
  const type = h['種別']||'';
  const dc = type==='入庫'?'in':type==='出庫'?'out':'adj';
  const prefix = type==='入庫'?'+':type==='出庫'?'-':'±';
  return `<div class="log-item">
    <div class="log-dot ${dc}"></div>
    <div class="log-info">
      <div class="log-name">${h['品名']||''}</div>
      <div class="log-meta">${type} · ${h['処理者']||''}${h['備考']?' · '+h['備考']:''}</div>
    </div>
    <div class="log-right">
      <div class="log-qty ${dc}">${prefix}${fmtNum(h['数量'])} ${h['単位']||''}</div>
      <div class="log-time">${fmtDate(h['日時'])}</div>
    </div>
  </div>`;
}

function fmtDate(str) {
  if (!str) return '';
  const d = new Date(String(str).replace(/\//g,'-'));
  if (isNaN(d)) return str;
  const now = new Date(), diff = now - d;
  const hm = `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
  if (diff < 86400000) return `今日 ${hm}`;
  if (diff < 172800000) return `昨日 ${hm}`;
  return `${d.getMonth()+1}/${d.getDate()} ${hm}`;
}

function showScreen(id, btn) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('screen-'+id).classList.add('active');
  btn.classList.add('active');
  if (id==='log' && !state.history.length) loadHistory();
  if (id==='move') hideForm();
}

function showToast(msg, type) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = `toast ${type} show`;
  setTimeout(() => t.classList.remove('show'), 2500);
}
</script>
</body>
</html>
